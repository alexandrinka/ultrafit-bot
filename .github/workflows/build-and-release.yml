name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-SNAPSHOT" >> "$GITHUB_ENV"
          fi

      - name: Build and test
        shell: bash
        run: |
          mvn --batch-mode --file ultrafitBot/pom.xml clean verify \
            -Drevision="$APP_VERSION" \
            -Dgithub.repository="$GITHUB_REPOSITORY"

      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd ultrafitBot/target
          sha256sum ultrafitBot.jar > ultrafitBot.jar.sha256
          cd ../..
          mkdir -p dist/UltrafitBot
          cp ultrafitBot/target/ultrafitBot.jar dist/UltrafitBot/
          cp run-ultrafit.bat ultrafit-secrets.example.bat README.md dist/UltrafitBot/
          cd dist
          zip -r UltrafitBot-windows.zip UltrafitBot

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "ultrafitBot/target/ultrafitBot.jar#Ultrafit Bot JAR" \
            "ultrafitBot/target/ultrafitBot.jar.sha256#SHA-256" \
            "dist/UltrafitBot-windows.zip#Первоначальная установка для Windows" \
            --verify-tag \
            --generate-notes \
            --title "Ultrafit Bot $GITHUB_REF_NAME"
